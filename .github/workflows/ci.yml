name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: pnpm build
      # Browser journeys (task 14): Chromium only, against the built API and web app on a test database.
      - run: pnpm --filter @closyria/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-reports
          path: |
            e2e/reports/html
            e2e/reports/test-results
            e2e/reports/csp-violations.json
            e2e/reports/servers.log
          if-no-files-found: ignore
          retention-days: 14
